<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestration Prototype</title>
<style>
:root {
  --doc-bg: #f1efe9; --doc-fg: #2b2a27; --doc-muted: #8a877f; --doc-surface: #ffffff; --doc-line: #0002; --doc-accent: #16a34a;
  --bg: #ffffff; --fg: #1f1f1f; --muted: #6b6b6b; --border: #e6e6e6; --side: #f7f7f6;
  --ok: #1a7f37; --warn: #b45309; --bad: #cf222e; --info: #2563eb;
  --hover: rgba(0,0,0,0.05); --chip: rgba(0,0,0,0.06); --track: rgba(0,0,0,0.12);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --doc-bg: #161513; --doc-fg: #e9e6df; --doc-muted: #8f8b82; --doc-surface: #211f1c; --doc-line: #fff2; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--doc-bg); color: var(--doc-fg); font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }
.page { display: grid; grid-template-columns: 290px 1fr; gap: 18px; padding: 18px; min-height: 100vh; }
.ctl { background: var(--doc-surface); border: 1px solid var(--doc-line); border-radius: 12px; padding: 14px; align-self: start; position: sticky; top: 18px; max-height: calc(100vh - 36px); overflow: auto; }
.ctl h1 { font-size: 16px; margin: 0 0 2px; }
.ctl .sub { color: var(--doc-muted); font-size: 12px; margin: 0 0 12px; }
.ctl h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--doc-muted); margin: 16px 0 6px; }
.ctl button { display: block; width: 100%; text-align: left; margin: 0 0 5px; padding: 6px 9px; border-radius: 7px; border: 1px solid var(--doc-line); background: transparent; color: inherit; font: inherit; font-size: 12.5px; cursor: pointer; }
.ctl button:hover { background: color-mix(in srgb, var(--doc-fg) 7%, transparent); }
.ctl button:disabled { opacity: .4; cursor: default; }
.ctl label { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; margin: 0 0 6px; gap: 8px; }
.ctl select, .ctl input[type=range] { font: inherit; font-size: 12px; }
.ctl .log { font: 11px/1.45 ui-monospace, Menlo, monospace; color: var(--doc-muted); white-space: pre-wrap; max-height: 180px; overflow: auto; border-top: 1px solid var(--doc-line); padding-top: 6px; margin-top: 8px; }
.stage { overflow-x: auto; }
.win { display: flex; height: 780px; min-width: 900px; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px #0002; font: 13px/1.35 system-ui, -apple-system, sans-serif; }
.win svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.lnav { width: 210px; background: var(--side); border-right: 1px solid var(--border); padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.lnav .proj { font-size: 11px; font-weight: 650; color: #888; text-transform: uppercase; letter-spacing: .05em; padding: 8px 8px 4px; }
.lnav .ws { padding: 5px 8px; border-radius: 6px; display: flex; gap: 7px; align-items: center; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lnav .ws:hover { background: var(--hover); }
.lnav .ws.on { background: #fff; box-shadow: 0 0 0 1px var(--border); }
.lnav .ws .d { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.main { flex: 1; min-width: 260px; display: flex; flex-direction: column; }
.tabbar { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; min-height: 35px; }
.tabbar span { white-space: nowrap; padding: 6px 10px; border-radius: 6px 6px 0 0; color: #777; display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.tabbar span.on { background: #fff; color: #111; border: 1px solid var(--border); border-bottom-color: #fff; margin-bottom: -1px; }
.mbody { flex: 1; overflow: auto; padding: 16px; }
.right { border-left: 1px solid var(--border); display: flex; flex-direction: column; position: relative; container-type: inline-size; }
.tabs { display: flex; align-items: center; gap: 2px; padding: 8px 8px 6px; border-bottom: 1px solid var(--border); color: #555; }
.tabs .t { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; }
.tabs .t.on { border: 1.5px solid #bbb; color: #111; box-shadow: inset 0 -2px 0 #111; }
.sp { flex: 1; }
.pbody { flex: 1; overflow: auto; display: flex; flex-direction: column; min-height: 0; }
.hd { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
.ttl { font-weight: 650; font-size: 14px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 99px; background: var(--chip); font-size: 11.5px; color: #444; white-space: nowrap; }
.seg { display: inline-flex; background: var(--chip); border-radius: 7px; padding: 2px; }
.seg button { padding: 3px 9px; border-radius: 5px; font-size: 12px; color: #555; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; border: 0; background: transparent; font-family: inherit; }
.seg button.on { background: #fff; color: #111; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.redot { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); display: inline-block; }
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 6px; background: var(--chip); font-size: 12px; color: #222; cursor: pointer; border: 0; font-family: inherit; }
.btn:hover { background: rgba(0,0,0,.1); }
.btn.pri { background: #111; color: #fff; }
.btn.ghost { background: transparent; border: 1px solid var(--track); }
.btn.danger { background: var(--bad); color: #fff; }
.ib { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; color: #555; cursor: pointer; border: 0; background: transparent; }
.ib:hover { background: var(--hover); }
.muted { color: var(--muted); } .small { font-size: 11.5px; }
.compose { margin: 6px 12px 10px; border: 1px solid var(--track); border-radius: 10px; padding: 8px 10px; }
.compose textarea { width: 100%; border: 0; outline: none; resize: none; font: inherit; color: inherit; background: transparent; min-height: 36px; }
.compose .bar2 { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.grp-h { padding: 10px 14px 4px; font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: #8a8a8a; display: flex; gap: 6px; align-items: center; }
.n { background: var(--chip); border-radius: 99px; padding: 0 6px; font-weight: 600; letter-spacing: 0; }
.item { display: flex; gap: 9px; padding: 7px 10px 7px 14px; align-items: flex-start; cursor: pointer; position: relative; }
.item:hover { background: var(--hover); }
.dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: 0 0 auto; }
.mainc { flex: 1; min-width: 0; }
.l1 { display: flex; gap: 6px; align-items: baseline; }
.name { font-weight: 560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.num { color: #888; font-size: 12px; }
.l2 { color: var(--muted); font-size: 12px; margin-top: 1px; }
.rt { font-size: 11.5px; color: #888; white-space: nowrap; }
.tag { font-size: 10.5px; padding: 0 5px; border-radius: 4px; background: var(--chip); color: #555; margin-left: 4px; }
.bg-bad { background: var(--bad); } .bg-ok { background: var(--ok); } .bg-warn { background: var(--warn); } .bg-info { background: var(--info); } .bg-mute { background: #bbb; }
.c-bad { color: var(--bad); } .c-ok { color: var(--ok); } .c-warn { color: var(--warn); }
.foot { border-top: 1px solid var(--border); padding: 7px 12px; display: flex; gap: 14px; color: #666; font-size: 12px; align-items: center; flex-wrap: wrap; }
.foot .d { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.guard { margin: 8px 12px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--bad) 8%, transparent); color: #7a1d1d; font-size: 12px; display: flex; gap: 8px; align-items: center; }
.guard.att { background: color-mix(in srgb, var(--warn) 10%, transparent); color: #6b3b00; }
.card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 11px; }
.term { margin: 0 12px 8px; background: #111; color: #d6d6d6; border-radius: 8px; padding: 10px; font: 11.5px/1.5 ui-monospace, Menlo, monospace; flex: 1; overflow: auto; min-height: 120px; }
.term .g { color: #7ee787; } .term .y { color: #e3b341; } .term .c { color: #79c0ff; } .term .m { color: #8b949e; } .term .r { color: #ff7b72; }
.menu { position: absolute; right: 8px; top: 30px; background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.18); z-index: 5; min-width: 170px; padding: 4px; }
.menu button { display: flex; gap: 8px; width: 100%; text-align: left; padding: 6px 8px; border: 0; background: transparent; font: inherit; font-size: 12.5px; border-radius: 5px; cursor: pointer; color: #222; align-items: center; }
.menu button:hover { background: var(--hover); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.kb { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; padding: 4px 12px 10px; }
.kc { background: rgba(0,0,0,0.03); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 6px; min-height: 260px; }
.kh { font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: #8a8a8a; padding: 2px 4px; display: flex; gap: 6px; align-items: center; }
.kt { background: #fff; border: 1px solid var(--border); border-radius: 7px; padding: 7px 8px; font-size: 12px; cursor: pointer; position: relative; }
.kt:hover { border-color: #ccc; }
.kt .bdg { display: flex; gap: 6px; align-items: center; margin-top: 5px; font-size: 11px; color: #888; }
.kt .bdg .dot { width: 7px; height: 7px; margin: 0; }
.toasts { position: fixed; right: 18px; top: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
.toast { background: #222; color: #fff; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; box-shadow: 0 8px 24px #0004; max-width: 300px; font-family: system-ui, sans-serif; }
.toast b { display: block; font-size: 11px; color: #aaa; margin-bottom: 2px; font-weight: 600; }
.chatmsg { padding: 8px 14px; }
.msg.me { margin-left: auto; background: var(--chip); padding: 7px 10px; border-radius: 12px 12px 3px 12px; max-width: 85%; width: fit-content; }
.msg.ai { margin: 8px 0; }
.set { max-width: 560px; }
.set .row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 20px; }
.pset .set .row { flex-wrap: wrap; gap: 8px; }
.set .k { font-weight: 600; } .set .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
.set select, .set input { font: inherit; font-size: 12.5px; padding: 4px 6px; border: 1px solid var(--track); border-radius: 6px; background: #fff; color: #111; }
.agentrow { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; }
.agentrow:hover { background: var(--hover); }
.agentrow.on { border-color: #111; }
.agentrow.dis { opacity: .45; cursor: default; }
.empty { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px; }
.queued { margin: 0 12px 6px; font-size: 12px; padding: 6px 9px; border-radius: 7px; background: color-mix(in srgb, var(--info) 8%, transparent); color: #1e3a8a; }
.gatebtns { display: flex; gap: 6px; margin-top: 6px; }
@container (min-width: 640px) { .narrow-only { display: none !important; } }
@container (max-width: 639px) { .wide-only { display: none !important; } }
</style>

<div class="page">
  <aside class="ctl">
    <h1>Orchestration prototype</h1>
    <p class="sub">Fake data. Click around the panel, then use these to make things happen.</p>

    <h2>Panel</h2>
    <label>Width <span><input id="w" type="range" min="360" max="820" value="400"> <span id="wv">400</span>px</span></label>
    <label>Chat style <select id="surf"><option value="chat">Chat</option><option value="terminal">Terminal</option></select></label>
    <label>Orchestrator agent <select id="agentSel"></select></label>
    <button id="reset">Start over (first run)</button>
    <button id="skip">Skip to: 4 workers running</button>

    <h2>GitHub events</h2>
    <button data-ev="ci">CI fails on bug hotkey (#4547)</button>
    <button data-ev="review">Review comment on calendar (#4545)</button>
    <button data-ev="conflict">Merge conflict on settings sync (#4551)</button>
    <button data-ev="green">All checks pass on bug hotkey</button>
    <button data-ev="ready">Make chat opening screen ready (#4546)</button>

    <h2>Agents</h2>
    <button data-ev="gate">Orchestrator raises a question for you</button>
    <button data-ev="push">Worker pushes a fix</button>
    <button data-ev="merge">A worker tries gh pr merge</button>
    <button data-ev="mergeOther">A Gemini worker tries to merge (not blockable)</button>

    <div class="log" id="log"></div>
  </aside>

  <main class="stage">
    <div class="win" id="win">
      <nav class="lnav" id="lnav"></nav>

        <div class="tabs"><span class="t"><svg><use href="#i-files"/></svg></span><span class="t"><svg><use href="#i-grid"/></svg></span><span class="t"><svg><use href="#i-branch"/></svg></span><span class="t"><svg><use href="#i-tasks"/></svg></span><span class="t"><svg><use href="#i-plug"/></svg></span><span class="t"><svg><use href="#i-activity"/></svg></span><span class="t"><svg><use href="#i-play"/></svg></span><span class="t on"><svg><use href="#i-net"/></svg></span><span class="t"><svg><use href="#i-blocks"/></svg></span><span class="sp"></span><span class="t"><svg><use href="#i-panel"/></svg></span></div>

<script>
var AGENTS = [
  { id: "claude", label: "Claude", cmd: "claude", installed: true, chat: true, guard: true },
  { id: "codex", label: "Codex", cmd: "codex", installed: true, chat: true, guard: false },
  { id: "grok", label: "Grok", cmd: "grok", installed: true, chat: true, guard: false },
  { id: "gemini", label: "Gemini", cmd: "gemini", installed: true, chat: false, guard: false },
  { id: "antigravity", label: "Antigravity", cmd: "agy", installed: true, chat: true, guard: false },
  { id: "cursor", label: "Cursor", cmd: "cursor-agent", installed: true, chat: false, guard: false },
  { id: "copilot", label: "GitHub Copilot", cmd: "copilot", installed: false, chat: true },
  { id: "opencode", label: "OpenCode", cmd: "opencode", installed: false, chat: true },
  { id: "aider", label: "Aider", cmd: "aider", installed: false, chat: false },
  { id: "goose", label: "Goose", cmd: "goose", installed: false, chat: false },
  { id: "kimi", label: "Kimi", cmd: "kimi", installed: false, chat: true },
  { id: "droid", label: "Droid", cmd: "droid", installed: false, chat: false }
];

function fresh() {
  return {
    firstRun: true, view: "chat", agent: "claude", surface: "chat", suffix: "-oa", interval: 60, attempts: 3, guardOn: true,
    orch: null, queued: [], workers: [], term: [], reports: [], banner: null, blocks: 0, menu: null, confirmRm: null,
    mainTab: "home", gate: null, polling: false
  };
}
var S = fresh();
var clock = 0;

function agentOf(id) { return AGENTS.filter(function (a) { return a.id === id; })[0]; }
function surfaceFor(id) { return S.surface; }
function log(t) { var el = document.getElementById("log"); el.textContent = "› " + t + "\n" + el.textContent; }
function toast(title, body) {
  var t = document.createElement("div"); t.className = "toast"; t.innerHTML = "<b>Orca · Orchestration</b>" + title + (body ? "<div style='color:#ccc;margin-top:2px'>" + body + "</div>" : "");
  document.getElementById("toasts").appendChild(t); setTimeout(function () { t.remove(); }, 4500);
}
function W(name) { return S.workers.filter(function (w) { return w.key === name; })[0]; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function seedWorkers() {
  S.workers = [
    mk("hotkey", "bug hotkey", 4547, "feat/bug-report-hotkey", "watching", "CI running"),
    mk("calendar", "calendar month picker", 4545, "feat/calendar-rail-month-bottom", "watching", "CI running"),
    mk("chatscreen", "chat opening screen", 4546, "feat/chat-opening-screen", "watching", "CI running"),
    mk("settings", "settings sync", 4551, "feat/settings-sync", "watching", "CI running", "gemini")
  ];
  S.workers[2].draft = true;
}
function mk(key, title, pr, branch, state, detail, agent) {
  return { key: key, title: title, pr: pr, branch: branch, state: state, detail: detail, attempts: 0, agent: agent || "claude", draft: false, kept: false, stopped: false, seen: {}, updated: clock };
}
function wname(w) { return w.title + S.suffix; }

function startOrchestrator(task) {
  var surf = surfaceFor(S.agent);
  S.orch = { agent: S.agent, surface: surf, run: "r-" + (80 + Math.floor(Math.random() * 9)), status: "working" };
  S.term = [
    { c: "m", t: "orchestrator · " + agentOf(S.agent).cmd + " · yimby" },
    { c: "c", t: "› " + task },
    { c: "m", t: "orca skills get orchestration" },
    { c: "m", t: "orca orchestration run-create --title \"" + task.slice(0, 40) + "\"" }
  ];
  S.reports = [{ who: "you", t: task }];
  log("agent.launch --agent " + S.agent + " (background terminal) in ~/.orca-orchestration/yimby · project.setHidden · env ORCA_ORCH_URL + token");
  render();
  setTimeout(function () {
    seedWorkers();
    S.workers.forEach(function (w) {
      S.term.push({ c: "g", t: "● worker-start --repo name:yimby --agent " + w.agent + " --worktree new-top-level --name " + w.key + S.suffix + " --comment \"orchestration-plugin run:" + S.orch.run + "\"" });
    });
    S.term.push({ c: "m", t: "curl -s $ORCA_ORCH_URL/say -d '{\"kind\":\"progress\",…}'" });
    S.term.push({ c: "m", t: "waiting for worker_done…" });
    S.reports.push({ who: "ai", t: "Started 4 workers, one per PR, each in its own worktree. The panel will send CI failures and review comments to the owner." });
    S.orch.status = "waiting"; S.polling = true; S.view = "board";
    log("worker-start ×4 · reference add ×4 (PR links on each workspace)");
    toast("4 workers started", "Watching their PRs every " + S.interval + "s");
    render();
  }, 1100);
}

function sendTask(text) {
  if (!text.trim()) return;
  if (!S.orch) { startOrchestrator(text.trim()); return; }
  var t = text.trim();
  if (S.orch.status === "working") { S.queued.push(t); log("orchestrator is working · held in the panel"); render(); return; }
  deliver(t);
}
function deliver(t) {
  S.reports.push({ who: "you", t: t });
  S.term.push({ c: "c", t: "› " + t });
  S.orch.status = "working";
  log("terminal.sendText → hidden orchestrator");
  render();
  setTimeout(function () {
    S.reports.push({ who: "ai", t: "On it: “" + t.slice(0, 60) + "”." });
    S.term.push({ c: "m", t: "curl -s $ORCA_ORCH_URL/say -d '{\"kind\":\"progress\",…}'" });
    S.orch.status = "waiting";
    render();
    var next = S.queued.shift();
    if (next) setTimeout(function () { deliver(next); }, 500);
  }, 2600);
}

function ev(kind) {
  if (!S.workers.length && kind !== "gate") { toast("No workers yet", "Start a task first, or use “Skip to”."); return; }
  clock++;
  var w;
  if (kind === "ci") {
    w = W("hotkey");
    if (w.state === "needs" && w.attempts >= S.attempts) { toast("Not sent", "bug hotkey hit the attempt limit; it's waiting for you"); return; }
    w.attempts++;
    if (w.attempts > S.attempts) w.attempts = S.attempts;
    if (w.attempts >= S.attempts && w.state === "fixing") {
      w.state = "needs"; w.detail = "CI still red after " + S.attempts + " attempts · Retry or take over";
      toast("bug hotkey needs you", "CI failed " + S.attempts + " times on Expo jest 3/3");
      log("attempt limit hit · not sent again");
    } else {
      w.state = "fixing"; w.detail = "CI red: Expo jest 3/3 · attempt " + w.attempts + "/" + S.attempts;
      log("gh run view --log-failed · orchestration send --to dispatch:" + w.key);
      S.term.push({ c: "y", t: "! #4547 CI failed → " + wname(w) + " (" + w.attempts + "/" + S.attempts + ")" });
    }
  } else if (kind === "review") {
    w = W("calendar"); w.state = "fixing"; w.detail = "2 review threads sent"; log("2 unresolved threads → dispatch:calendar");
    S.term.push({ c: "y", t: "! #4545 2 review threads → " + wname(w) });
  } else if (kind === "conflict") {
    w = W("settings"); w.state = "fixing"; w.detail = "Merge conflict with main · told to merge origin/main"; log("mergeable=CONFLICTING → dispatch:settings");
    S.term.push({ c: "y", t: "! #4551 conflict → " + wname(w) });
  } else if (kind === "green") {
    w = W("hotkey"); w.state = "ready"; w.attempts = 0; w.detail = "Ready to merge"; toast("#4547 ready for you", "Green · 0 threads · mergeable");
  } else if (kind === "ready") {
    w = W("chatscreen"); w.draft = false; w.state = "ready"; w.detail = "Ready to merge"; toast("#4546 ready for you", "Green · 0 threads · mergeable");
  } else if (kind === "push") {
    S.workers.forEach(function (x) { if (x.state === "fixing") { x.state = "watching"; x.detail = "Pushed a fix · CI running"; } });
    log("new head SHA seen · back to Watching");
  } else if (kind === "gate") {
    if (!S.workers.length) { toast("No workers yet"); return; }
    w = W("calendar"); w.state = "needs"; w.detail = "Keep the month rail on iPad?"; w.gate = { q: "Keep the month rail on iPad?", opts: ["Yes", "No"] };
    S.reports.push({ who: "ai", t: "#4545 needs a decision from you: keep the month rail on iPad?", q: "calendar" });
    S.term.push({ c: "y", t: "? gate-create #4545: keep the month rail on iPad? [Yes/No]" });
    log("gate-create (orchestrator) · plugin read gate-list");
    toast("A decision needs you", "#4545: keep the month rail on iPad?");
  } else if (kind === "merge") {
    w = W("hotkey");
    if (S.guardOn) { S.banner = { kind: "blocked", who: wname(w), cmd: "gh pr merge 4547" }; S.blocks++; log("agent.tool.before → deny"); w.state = "needs"; w.detail = "Tried to merge · blocked"; }
    else { S.banner = { kind: "attempted", who: wname(w), cmd: "gh pr merge 4547" }; log("guard off · not blocked"); }
  } else if (kind === "mergeOther") {
    w = W("settings"); S.banner = { kind: "attempted", who: wname(w) + " (Gemini)", cmd: "gh pr merge 4551" }; log("agent.tool.after only · Gemini can't be blocked");
  }
  if (w) w.updated = clock;
  render();
}

    row("Chat style", "How the panel shows the orchestrator. It always runs hidden.", '<select onchange="act(\'surf\',this.value)"><option value="chat"' + (S.surface === "chat" ? " selected" : "") + '>Chat</option><option value="terminal"' + (S.surface === "terminal" ? " selected" : "") + ">Terminal</option></select>") +
    row("Orchestrator agent", "Runs the plan and starts workers", '<select onchange="act(\'pickAgent\',this.value)">' + opts + "</select>") +
    row("Default worker agent", "The orchestrator can still pick per task", '<select>' + opts + "</select>") +
    row("Worker name suffix", "Passed as --name to every worker", '<input value="' + esc(S.suffix) + '" oninput="act(\'suffix\',this.value)" style="width:90px">') +
    row("Check GitHub every", "Uses your gh login; no token needed", '<select onchange="act(\'interval\',this.value)">' + [30, 60, 120, 300].map(function (s) { return "<option" + (S.interval == s ? " selected" : "") + ' value="' + s + '">' + s + " seconds</option>"; }).join("") + "</select>") +
    row("Fix attempts before asking you", "Per failure, then the PR moves to Needs you", '<select onchange="act(\'attempts\',this.value)">' + [1, 2, 3, 5].map(function (s) { return "<option" + (S.attempts == s ? " selected" : "") + ">" + s + "</option>"; }).join("") + "</select>") +
    row("Merge guard", "Blocks merges, force-pushes and pushes to main for the panel's Claude agents", '<span class="seg"><button class="' + (S.guardOn ? "on" : "") + '" onclick="act(\'guard\',1)">On</button><button class="' + (S.guardOn ? "" : "on") + '" onclick="act(\'guard\',0)">Off</button></span>') +
    row("Nightly sweep", "An Orca automation re-checks every panel PR at 2am", '<span class="seg"><button>On</button><button class="on">Off</button></span>') + "</div>";
  function row(k, d, c) { return '<div class="row"><div><div class="k">' + k + '</div><div class="d">' + d + "</div></div>" + c + "</div>"; }
}
function renderNav() {
  var nav = '<div class="proj">yimby</div><div class="ws ' + (S.mainTab === "home" ? "on" : "") + '" onclick="act(\'tab\',\'home\')"><span class="d bg-mute"></span>main</div>';
  S.workers.forEach(function (w) { nav += '<div class="ws" style="padding-left:20px;cursor:default"><span class="d ' + DOT[groupOf(w)] + '"></span>' + esc(wname(w)) + "</div>"; });
  nav += '<div class="proj" style="margin-top:10px">alcove</div><div class="ws"><span class="d bg-mute"></span>main</div>';
  document.getElementById("lnav").innerHTML = nav;
}

function render() {
  var p = document.getElementById("panel");
  var keep = document.getElementById("ta"); var draft = keep ? keep.value : "";
  p.innerHTML = S.firstRun ? renderFirstRun() : S.showSettings ? renderSettingsPanel() : S.detail ? renderDetail() : (S.view === "board" ? renderBoard() : renderChat());
  var ta = document.getElementById("ta"); if (ta && draft) ta.value = draft;
  var tb = document.getElementById("termbox"); if (tb) tb.scrollTop = tb.scrollHeight;
  var cb = document.getElementById("chatbox"); if (cb) cb.scrollTop = cb.scrollHeight;
  renderFoot(); renderMain(); renderNav();
  document.getElementById("agentSel").value = S.agent;
  document.getElementById("surf").value = S.surface;
  document.querySelectorAll("[data-ev]").forEach(function (b) { b.disabled = S.firstRun || !S.orch; });
}

function act(kind, a, b) {
  if (kind !== "menu" && kind !== "rm" && kind !== "rmno") { S.menu = null; S.confirmRm = null; }
  var w = a && W(a);
  switch (kind) {
    case "view": S.view = a; S.detail = null; S.showSettings = false; break;
    case "pickAgent": S.agent = a; break;
    case "surf": S.surface = a; if (S.orch) S.orch.surface = a; break;
    case "finishFirst": S.firstRun = false; S.view = "chat"; log("first run saved · Chat style=" + S.surface + " · agent=" + S.agent); break;
    case "sugg": var ta = document.getElementById("ta"); if (ta) ta.value = a; break;
    case "send": var t = document.getElementById("ta"); var v = t ? t.value : ""; if (t) t.value = ""; sendTask(v); return;
    case "termsend": var t2 = document.getElementById("ta"); if (t2 && t2.value.trim()) { S.term.push({ c: "c", t: "› " + t2.value }); log("terminal send → orchestrator"); t2.value = ""; } break;
    case "newtask": S.view = "chat"; S.detail = null; S.showSettings = false; render(); setTimeout(function () { var x = document.getElementById("ta"); if (x) x.focus(); }, 0); return;
    case "settings": S.showSettings = true; S.detail = null; break;
    case "tab": S.mainTab = a; break;
    case "open": S.detail = a; S.detailTab = "activity"; log("worker details in the panel · worker-show " + w.key); break;
    case "back": if (S.showSettings) S.showSettings = false; else S.detail = null; break;
    case "dtab": S.detailTab = a; log(a === "terminal" ? "terminal read (worker, read-only mirror)" : a === "diff" ? "gh pr diff" : "worker-show"); break;
    case "msgsend": var mt = document.getElementById("ta"); if (mt && mt.value.trim()) { log("orchestration send --to dispatch:" + w.key + " · " + mt.value.trim()); toast("Sent to " + wname(w), "Arrives when its turn ends"); mt.value = ""; } break;
    case "ghpr": log("shell.openExternal github.com/…/pull/" + w.pr + " (browser, not an Orca tab)"); toast("Opens in your browser", "PR #" + w.pr); break;
    case "menu": S.menu = S.menu === a ? null : a; S.confirmRm = null; break;
    case "diff": S.detail = a; S.detailTab = "diff"; log("gh pr diff " + w.pr + " · in the panel"); break;
    case "term": S.detail = a; S.detailTab = "terminal"; log("terminal read · " + w.key + " · in the panel"); break;
    case "msg": S.detail = a; S.detailTab = "activity"; render(); setTimeout(function () { var x = document.getElementById("ta"); if (x) x.focus(); }, 0); return;
    case "retry": w.attempts = 0; w.state = "fixing"; w.detail = "Retrying: CI log re-sent · attempt 1/" + S.attempts; w.attempts = 1; log("attempt counter reset · re-sent"); break;
    case "keep": w.kept = !w.kept; log("orchestration worker-keep-open · " + w.key); break;
    case "stop": w.stopped = true; w.state = "needs"; w.detail = "Stopped by you"; log("orchestration worker-stop · " + w.key); break;
    case "rm": S.menu = a; S.confirmRm = a; break;
    case "rmno": S.menu = null; S.confirmRm = null; break;
    case "rmyes": S.workers = S.workers.filter(function (x) { return x.key !== a; }); if (S.detail === a) S.detail = null; log("worktree rm · " + a); toast("Worktree removed", "Branch and PR stay on GitHub"); break;
    case "gate": w.gate = null; w.state = "fixing"; w.detail = "You answered “" + b + "” · worker continuing"; S.reports.push({ who: "you", t: "Decision on #" + w.pr + ": " + b }); log("orchestration gate-resolve · " + b); break;
    case "dismiss": S.banner = null; break;
    case "suffix": S.suffix = a; break;
    case "interval": S.interval = +a; break;
    case "attempts": S.attempts = +a; break;
    case "guard": S.guardOn = !!a; break;
  }
  render();
}

document.addEventListener("click", function (e) { if (S.menu && !e.target.closest(".menu") && !e.target.closest(".ib")) { S.menu = null; S.confirmRm = null; render(); } });
document.getElementById("w").addEventListener("input", function (e) { document.getElementById("right").style.width = e.target.value + "px"; document.getElementById("wv").textContent = e.target.value; });
document.getElementById("surf").addEventListener("change", function (e) { act("surf", e.target.value); });
document.getElementById("agentSel").innerHTML = AGENTS.filter(function (a) { return a.installed; }).map(function (a) { return '<option value="' + a.id + '">' + a.label + (a.chat ? "" : " (CLI only)") + "</option>"; }).join("");
document.getElementById("agentSel").addEventListener("change", function (e) { act("pickAgent", e.target.value); });
document.getElementById("reset").addEventListener("click", function () { S = fresh(); document.getElementById("log").textContent = ""; render(); });
document.getElementById("skip").addEventListener("click", function () { S = fresh(); S.firstRun = false; startOrchestrator("Close out 4545, 4546, 4547, 4551 to merge-ready"); });
document.querySelectorAll("[data-ev]").forEach(function (b) { b.addEventListener("click", function () { ev(b.dataset.ev); }); });
document.getElementById("right").style.width = "400px";
render();
</script>
</body>
</html>
